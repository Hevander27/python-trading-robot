[main]
api_key = 39ZMUM2GrL0kUhBAGLsveihqtFpwqSQt
app_secret = ckMYbbaSn4XKLPF1
callback_url = https://127.0.0.1:8182
token_path = token.json
account_number = 23114266

[strategy]
budget = 1000
max_positions = 10
rebalance_threshold = 0.15
min_volume = 500000
momentum_lookback_days = 252
rebalance_frequency_days = 30
stop_loss_pct = 0.05
pre_filter_momentum = true
min_net_change_pct = 0.0

# Scoring weights — must sum to 1.0
# 12-month momentum is the primary signal (Dual Momentum strategy)
score_weight_momentum = 0.6
score_weight_ema = 0.3
score_weight_rsi = 0.1

# Allocation mode: equal_weight or score_weighted
# score_weighted puts more capital into higher-scoring stocks
allocation_mode = score_weighted

# Set to true to print the raw indicator table every loop tick
show_stock_frame = false

[universe]
# Path to the expanded universe CSV built by scripts/build_universe.py
# Falls back to data/nasdaq_symbols.csv if this file doesn't exist yet
universe_path = data/universe.csv

[regime]
# Market regime filter — stops new entries when SPY is below its 200-day EMA
enabled = true

# Stop loss tightens from stop_loss_pct to this value in a bear market
bear_stop_loss_pct = 0.03

# Cash/treasury ETF rotation when in bear market (leave blank to disable)
# Set to SHY (short-term treasury) or BIL to earn a small return on idle cash
cash_etf =

[sector]
# Maximum number of positions allowed in the same sector at one time
# Set to 0 to disable the sector cap
max_positions_per_sector = 3
